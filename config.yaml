# Kafka Configuration
kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    raw: "ticks.raw"
    features: "ticks.features"
    predictions: "ticks.predictions"
  consumer_group: "volatility_detector"

# Coinbase WebSocket Configuration
coinbase:
  ws_url: "wss://advanced-trade-ws.coinbase.com"
  channels:
    - "ticker"
  reconnect_delay: 5  # seconds
  heartbeat_interval: 30  # seconds

# Data Storage
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_format: "ndjson"  # or "parquet"

# Feature Engineering
features:
  window_size: 60  # seconds for feature windows
  prediction_horizon: 60  # seconds ahead for volatility prediction

# Model Configuration
model:
  train_test_split: 0.8
  validation_split: 0.1
  random_seed: 42
  # Threshold percentile for volatility spike detection (85, 90, 95, etc.)
  threshold_percentile: 95
  # Split strategy: 'temporal' (strict temporal) or 'stratified_temporal' (temporal with stratification)
  split_strategy: 'stratified_temporal'
  # Minimum positive label ratio in each split (for stratified_temporal)
  min_positive_ratio: 0.01  # 1% minimum

# MLflow Configuration
mlflow:
  tracking_uri: "http://localhost:5001"  # MLflow server URI (use http://mlflow:5000 in Docker)
  experiment_name: "volatility_detection"
  # Model loading options:
  # - "latest": Load latest run from experiment (requires MLflow connection)
  # - "run_id": Load specific run_id (set run_id below, requires MLflow connection)
  # - "local": Always use local artifacts (no MLflow required)
  model_source: "local"  # or "latest" or "run_id" - set to "local" to use models/artifacts/
  run_id: null  # Set to specific run_id if model_source is "run_id"
  model_type: "xgboost"  # "xgboost" or "logistic"
  use_calibrated: false  # Use calibrated model if available
