[pytest]
# Pytest configuration for CI and local testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Exclude script-based test files that require services
# These are meant to be run directly, not via pytest
norecursedirs = venv env .git __pycache__ mlruns data

# Test timeout (in seconds) - prevent hanging tests
timeout = 300

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that require services (Docker, MLflow, Kafka)
    slow: Tests that take a long time to run

